aid: matwings
name: Matwings Technology
description: >-
  Matwings Technology (天鹜科技) is a global, AI-driven full-stack protein research
  and development platform. Centered on its self-developed MatwingsVenus general
  large model for protein design, the company integrates an in-house AI biological
  design agent (MatwingsVenus Agent), a ten-billion-scale protein sequence dataset
  (MatwingsVenus Pod), and an automated experimental platform (MatwingsVenus Auto)
  to deliver an end-to-end paradigm that spans AI design through AI validation.
  Capabilities include AI-directed evolution, AI enzyme mining, and de novo protein
  design, applied across affinity fillers and consumables, holistic health, and
  innovative drug discovery. Matwings is a Qiming Venture Partners portfolio company
  headquartered in Shanghai, with peer-reviewed work at ICLR, NeurIPS, and PNAS. No
  public developer API, documentation, or SDK is currently published.
